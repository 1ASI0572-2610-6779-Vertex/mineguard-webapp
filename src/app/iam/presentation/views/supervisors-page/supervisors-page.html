<div class="sp-page">

  <!-- Header -->
  <header class="sp-header">
    <div class="sp-header-left">
      <div class="sp-icon">
        <mat-icon>manage_accounts</mat-icon>
      </div>
      <div class="sp-title-block">
        <h1 class="sp-title">{{ 'iam.supervisors.title' | translate }}</h1>
        <p class="sp-subtitle">{{ 'iam.supervisors.pageSubtitle' | translate }}</p>
      </div>
    </div>
    <div class="sp-header-right">
      @if (supervisorCount() > 0) {
        <span class="sp-count-chip">
          <mat-icon class="sp-count-icon">group</mat-icon>
          {{ 'iam.supervisors.count' | translate: { count: supervisorCount() } }}
        </span>
      }
      <button mat-flat-button class="sp-add-btn" (click)="openCreateDialog()">
        <mat-icon>person_add</mat-icon>
        {{ 'iam.supervisors.newSupervisor.title' | translate }}
      </button>
    </div>
  </header>

  <!-- Directory -->
  <div class="sp-body">
    <app-supervisor-directory [supervisors]="supervisors()"></app-supervisor-directory>
  </div>

</div>
